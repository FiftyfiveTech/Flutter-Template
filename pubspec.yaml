name: host_mobile_app
description: "A generic, production-ready Flutter Clean Architecture Starter Template with Riverpod and Drift."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  dio: ^5.7.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  meta: ^1.16.0
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
